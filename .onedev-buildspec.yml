version: 43
jobs:
- name: V Build
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: V Prod Build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        mkdir -p build
        v -prod -cc /usr/bin/gcc -o build/ps2_api .
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: Publish bin
    sourcePath: build/
    artifacts: '*'
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
    projects: oplnova_vapi
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
