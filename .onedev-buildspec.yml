version: 43
jobs:
- name: V Build
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: V Prod Build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        mkdir -p build temp_release
        v -prod -cc /usr/bin/gcc -o build/ps2_api .
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Copy Files to tmp dir
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        cp build/ps2_api temp_release/
        cp index.html temp_release/
        cp setup_db.sh temp_release/
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: Publish bin
    sourcePath: .
    artifacts: oplnova_vapi.zip
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Zip artifacts
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd temp_release
        zip -r ../oplnova_vapi.zip .
        cd ..
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
    projects: oplnova_vapi
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
